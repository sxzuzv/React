[project]
name = "insta-api"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "authlib>=1.9.10",
    "fastapi[standard]>=0.162.5",
    "itsdangerous>=2.2.0",
    "pillow>=13.0.0",
    "psycopg[binary]>=3.3.9",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.16.2",
    "pyjwt>=2.15.1",
    "sqlalchemy>=2.1.8",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
